apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voiceowl-mongo
spec:
  serviceName: "voiceowl-mongo"
  replicas: 1
  selector:
    matchLabels:
      app: voiceowl-mongo
  template:
    metadata:
      labels:
        app: voiceowl-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
